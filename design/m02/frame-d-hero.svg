<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="heroWall" cx="0.5" cy="0.34" r="1.15">
      <stop offset="0" stop-color="#503c28"/>
      <stop offset="0.5" stop-color="#382b1e"/>
      <stop offset="1" stop-color="#201812"/>
    </radialGradient>
    <linearGradient id="heroFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#463321"/>
      <stop offset="1" stop-color="#191209"/>
    </linearGradient>
    <radialGradient id="heroPool" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#d69a52" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#9c6733" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9c6733" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroBulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6de"/>
      <stop offset="0.2" stop-color="#ffe2b0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffb863" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffb863" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroWindow" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#283b57"/>
      <stop offset="1" stop-color="#121c2c"/>
    </radialGradient>
    <radialGradient id="heroMonitor" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2e604e"/>
      <stop offset="1" stop-color="#163025"/>
    </radialGradient>
    <filter id="softD"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- hero framing: slightly wider, room reads as a complete stage -->
  <rect width="1600" height="600" fill="url(#heroWall)"/>
  <polygon points="0,900 1600,900 1500,600 100,600" fill="url(#heroFloor)"/>
  <line x1="100" y1="600" x2="1500" y2="600" stroke="#241a10" stroke-width="4"/>

  <!-- rug anchoring composition center -->
  <ellipse cx="820" cy="740" rx="520" ry="120" fill="#2e2115"/>
  <ellipse cx="820" cy="736" rx="480" ry="102" fill="#3a2b1a"/>
  <ellipse cx="820" cy="640" rx="620" ry="220" fill="url(#heroPool)" filter="url(#softD)"/>

  <!-- window left third -->
  <g>
    <rect x="150" y="100" width="240" height="330" fill="#10141b"/>
    <rect x="165" y="115" width="210" height="300" fill="url(#heroWindow)"/>
    <rect x="265" y="115" width="10" height="300" fill="#10141b"/>
    <rect x="165" y="258" width="210" height="10" fill="#10141b"/>
    <circle cx="212" cy="175" r="24" fill="#96adcd" opacity="0.8"/>
    <polygon points="158,430 396,430 500,700 90,700" fill="#24354f" opacity="0.16" filter="url(#softD)"/>
    <rect x="388" y="102" width="6" height="330" fill="#96703c" opacity="0.5"/>
    <!-- curtain hint -->
    <path d="M 396 100 q 18 160 -6 334" stroke="#4a3623" stroke-width="16" fill="none" opacity="0.8"/>
  </g>

  <!-- shelf right-center wall -->
  <g>
    <rect x="940" y="336" width="330" height="13" rx="3" fill="#63482d"/>
    <rect x="940" y="349" width="330" height="6" fill="#241a10" opacity="0.5"/>
    <rect x="968" y="250" width="32" height="86" rx="2" fill="#8a5138"/>
    <rect x="1006" y="262" width="26" height="74" rx="2" fill="#5d6152"/>
    <rect x="1038" y="254" width="36" height="82" rx="2" fill="#6e4a52"/>
    <rect x="1080" y="268" width="24" height="68" rx="2" fill="#4f6155"/>
    <rect x="1108" y="256" width="30" height="80" rx="2" fill="#7a5638" transform="skewX(-6)"/>
    <rect x="1170" y="284" width="26" height="28" rx="4" fill="#9aa3ad"/>
    <rect x="1176" y="272" width="14" height="12" rx="3" fill="#c2cad2"/>
    <circle cx="1180" cy="278" r="2.4" fill="#2b5a4a"/>
    <circle cx="1186" cy="278" r="2.4" fill="#2b5a4a"/>
    <path d="M 1228 334 q -8 -30 6 -46 q 4 18 10 26 q 6 -20 16 -28" stroke="#54704a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="1240" cy="338" rx="22" ry="8" fill="#7a5638"/>
    <!-- corkboard with post-its above shelf -->
    <rect x="960" y="120" width="290" height="110" rx="4" fill="#4a3a26"/>
    <rect x="972" y="132" width="266" height="86" fill="#57452e"/>
    <rect x="988" y="146" width="30" height="30" fill="#d9c07a"/>
    <rect x="1030" y="156" width="30" height="30" fill="#a8bd8f"/>
    <rect x="1072" y="144" width="30" height="30" fill="#d99a7a"/>
    <rect x="1130" y="152" width="52" height="6" rx="3" fill="#8a7a5c"/>
    <rect x="1130" y="166" width="40" height="6" rx="3" fill="#8a7a5c"/>
  </g>

  <!-- door far right, inviting pool of its own -->
  <g>
    <rect x="1332" y="176" width="196" height="16" fill="#54402a"/>
    <rect x="1344" y="192" width="172" height="568" fill="#42301f"/>
    <rect x="1344" y="192" width="16" height="568" fill="#5e462d"/>
    <rect x="1360" y="240" width="140" height="200" fill="none" stroke="#5e462d" stroke-width="6"/>
    <rect x="1360" y="480" width="140" height="220" fill="none" stroke="#5e462d" stroke-width="6"/>
    <circle cx="1376" cy="470" r="8" fill="#d9a748"/>
    <polygon points="1344,760 1516,760 1556,880 1310,880" fill="#2a1d11" opacity="0.85"/>
  </g>

  <!-- desk center-right, hero of midground -->
  <g>
    <polygon points="690,556 1170,556 1196,588 664,588" fill="#82593a"/>
    <polygon points="690,556 1170,556 1170,565 690,565" fill="#a06f43"/>
    <rect x="706" y="588" width="24" height="216" fill="#503822"/>
    <rect x="1130" y="588" width="24" height="216" fill="#503822"/>
    <!-- drawer unit -->
    <rect x="1040" y="592" width="120" height="120" rx="4" fill="#5c4128"/>
    <rect x="1052" y="606" width="96" height="40" rx="3" fill="#6e4e30"/>
    <rect x="1052" y="654" width="96" height="40" rx="3" fill="#6e4e30"/>
    <rect x="1086" y="622" width="28" height="6" rx="3" fill="#c9a05c"/>
    <rect x="1086" y="670" width="28" height="6" rx="3" fill="#c9a05c"/>
    <!-- mug, notebook, headphones -->
    <rect x="1076" y="528" width="28" height="28" rx="6" fill="#8a5138"/>
    <path d="M1104 534 q 16 8 0 16" stroke="#8a5138" stroke-width="5" fill="none"/>
    <polygon points="736,548 806,544 810,558 732,560" fill="#d6cab2" opacity="0.9"/>
    <path d="M 960 546 a 26 26 0 0 1 52 0" stroke="#241a12" stroke-width="7" fill="none"/>
  </g>

  <!-- chair pulled slightly out -->
  <g>
    <rect x="540" y="462" width="136" height="22" rx="9" fill="#38291b"/>
    <rect x="538" y="350" width="17" height="128" rx="7" fill="#42301f"/>
    <rect x="660" y="350" width="17" height="128" rx="7" fill="#42301f"/>
    <rect x="560" y="484" width="15" height="200" fill="#2a1d11"/>
    <rect x="642" y="484" width="15" height="200" fill="#2a1d11"/>
    <rect x="512" y="684" width="196" height="13" rx="6" fill="#2a1d11"/>
  </g>

  <!-- monitor -->
  <g>
    <rect x="806" y="368" width="200" height="132" rx="7" fill="#181310"/>
    <rect x="818" y="380" width="176" height="108" fill="url(#heroMonitor)"/>
    <rect x="882" y="500" width="48" height="30" fill="#181310"/>
    <rect x="856" y="530" width="98" height="13" rx="6" fill="#181310"/>
    <g fill="#7fdfba" opacity="0.55">
      <rect x="832" y="392" width="100" height="5"/>
      <rect x="832" y="406" width="138" height="5"/>
      <rect x="832" y="420" width="72" height="5"/>
      <rect x="846" y="438" width="7" height="12"/>
    </g>
    <rect x="1010" y="372" width="4" height="128" fill="#96703c" opacity="0.45"/>
  </g>
  <polygon points="756,542 902,542 914,556 750,558" fill="#2a1d12"/>
  <rect x="932" y="538" width="54" height="11" rx="4" fill="#3d332a"/>

  <!-- long soft shadows -->
  <polygon points="706,804 742,804 852,900 772,900" fill="#140d07" opacity="0.7"/>
  <polygon points="1130,804 1166,804 1300,900 1222,900" fill="#140d07" opacity="0.65"/>
  <ellipse cx="610" cy="706" rx="150" ry="28" fill="#140d07" opacity="0.5"/>
  <ellipse cx="1430" cy="800" rx="120" ry="22" fill="#140d07" opacity="0.5"/>

  <!-- lamp: perfectly centered, stable, protagonist -->
  <g>
    <line x1="800" y1="0" x2="800" y2="224" stroke="#33281c" stroke-width="6"/>
    <polygon points="706,308 894,308 846,222 754,222" fill="#241a11"/>
    <polygon points="722,298 878,298 840,232 760,232" fill="#66492c"/>
    <polygon points="706,308 894,308 886,301 714,301" fill="#ffe4b2"/>
    <ellipse cx="800" cy="330" rx="400" ry="330" fill="url(#heroBulb)"/>
    <circle cx="800" cy="320" r="18" fill="#fff6de"/>
    <path d="M 800 310 q 5 6 -2 10 q 6 5 -1 10" stroke="#dd8f31" stroke-width="2.5" fill="none"/>
  </g>
  <path d="M 840 296 Q 848 380 844 470" stroke="#54402a" stroke-width="4" fill="none"/>
  <circle cx="844" cy="474" r="8" fill="#7a5f41"/>

  <!-- cinematic grade + gentle vignette -->
  <rect width="1600" height="900" fill="#2b1a08" opacity="0.05"/>
  <rect width="1600" height="900" fill="#000000" opacity="0.07"/>
</svg>
