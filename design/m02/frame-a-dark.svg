<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wallDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d13"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="floorDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="moonWindow" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#2a3c58"/>
      <stop offset="0.55" stop-color="#182639"/>
      <stop offset="1" stop-color="#101a29"/>
    </radialGradient>
    <radialGradient id="monitorGlow" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2f6b57"/>
      <stop offset="0.5" stop-color="#1c4438"/>
      <stop offset="1" stop-color="#12291f"/>
    </radialGradient>
    <radialGradient id="monitorSpill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6b57" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f6b57" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- room -->
  <rect width="1600" height="620" fill="url(#wallDark)"/>
  <polygon points="0,900 1600,900 1480,620 120,620" fill="url(#floorDark)"/>
  <!-- skirting line -->
  <line x1="120" y1="620" x2="1480" y2="620" stroke="#0d1118" stroke-width="3"/>

  <!-- window (cold moonlight anchor) -->
  <g>
    <rect x="140" y="110" width="250" height="320" fill="#04060b"/>
    <rect x="155" y="125" width="220" height="290" fill="url(#moonWindow)"/>
    <rect x="260" y="125" width="10" height="290" fill="#04060b"/>
    <rect x="155" y="262" width="220" height="10" fill="#04060b"/>
    <!-- moon -->
    <circle cx="205" cy="185" r="26" fill="#8ea7c9" opacity="0.85"/>
    <circle cx="212" cy="180" r="26" fill="#182639" opacity="0.6"/>
    <!-- moon spill on floor -->
    <polygon points="150,430 390,430 520,760 60,760" fill="#1b2a40" opacity="0.22" filter="url(#soft)"/>
  </g>

  <!-- door silhouette -->
  <g fill="#05070c">
    <rect x="1310" y="200" width="170" height="560" />
    <rect x="1298" y="188" width="194" height="16"/>
    <circle cx="1338" cy="492" r="7" fill="#10151f"/>
  </g>

  <!-- shelf silhouette -->
  <g fill="#05070b">
    <rect x="960" y="330" width="300" height="14"/>
    <rect x="985" y="252" width="34" height="78"/>
    <rect x="1026" y="262" width="28" height="68"/>
    <rect x="1060" y="256" width="38" height="74"/>
    <rect x="1120" y="270" width="26" height="60"/>
    <rect x="1152" y="258" width="32" height="72"/>
    <circle cx="1215" cy="305" r="24"/>
  </g>

  <!-- chair silhouette -->
  <g fill="#04060a">
    <rect x="565" y="470" width="130" height="18" rx="6"/>
    <rect x="565" y="360" width="16" height="128"/>
    <rect x="679" y="360" width="16" height="128"/>
    <rect x="585" y="488" width="14" height="190"/>
    <rect x="660" y="488" width="14" height="190"/>
  </g>

  <!-- desk silhouette -->
  <g fill="#05070b">
    <polygon points="700,560 1160,560 1180,586 680,586"/>
    <rect x="716" y="586" width="20" height="210"/>
    <rect x="1120" y="586" width="20" height="210"/>
  </g>

  <!-- monitor: only lit element besides window -->
  <g>
    <ellipse cx="905" cy="470" rx="300" ry="200" fill="url(#monitorSpill)" filter="url(#soft)"/>
    <rect x="812" y="376" width="196" height="126" rx="6" fill="#0a0f0e"/>
    <rect x="824" y="388" width="172" height="102" fill="url(#monitorGlow)"/>
    <rect x="886" y="502" width="46" height="26" fill="#0a0f0e"/>
    <rect x="862" y="528" width="94" height="10" rx="4" fill="#0a0f0e"/>
    <!-- faint terminal lines on screen -->
    <g fill="#79d9b8" opacity="0.55">
      <rect x="838" y="400" width="96" height="5"/>
      <rect x="838" y="414" width="132" height="5"/>
      <rect x="838" y="428" width="70" height="5"/>
      <rect x="850" y="446" width="6" height="10"/>
    </g>
  </g>

  <!-- keyboard hint -->
  <polygon points="760,548 900,548 908,558 752,558" fill="#070a0e"/>

  <!-- lamp: silhouette only, cord faintly catching window light -->
  <g>
    <line x1="800" y1="0" x2="800" y2="232" stroke="#10141c" stroke-width="5"/>
    <polygon points="716,306 884,306 842,228 758,228" fill="#04060a"/>
    <ellipse cx="800" cy="308" rx="84" ry="10" fill="#0b0e15"/>
    <!-- bulb: cold unlit glass catching moonlight -->
    <circle cx="800" cy="322" r="17" fill="#151b26"/>
  </g>

  <!-- pull cord, discoverable via window-side highlight -->
  <path d="M 836 296 Q 842 380 838 470" stroke="#1c2331" stroke-width="4" fill="none"/>
  <circle cx="838" cy="474" r="8" fill="#232c3d"/>

  <!-- global cool grade -->
  <rect width="1600" height="900" fill="#101a2b" opacity="0.10"/>
</svg>
