<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="warmRoom" cx="0.5" cy="0.36" r="1.05">
      <stop offset="0" stop-color="#4a3826"/>
      <stop offset="0.45" stop-color="#33281e"/>
      <stop offset="1" stop-color="#1c1510"/>
    </radialGradient>
    <linearGradient id="floorC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2c1c"/>
      <stop offset="1" stop-color="#171009"/>
    </linearGradient>
    <radialGradient id="poolMain" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#c98f4a" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#96622f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#96622f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulbGlowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d8"/>
      <stop offset="0.18" stop-color="#ffdfae" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffb35c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonWindowC" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#243650"/>
      <stop offset="1" stop-color="#101a29"/>
    </radialGradient>
    <radialGradient id="monitorGlowC" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2b5a4a"/>
      <stop offset="1" stop-color="#142e23"/>
    </radialGradient>
    <filter id="softC"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <!-- room fully revealed, warm -->
  <rect width="1600" height="620" fill="url(#warmRoom)"/>
  <polygon points="0,900 1600,900 1480,620 120,620" fill="url(#floorC)"/>

  <!-- main light pool under lamp -->
  <ellipse cx="800" cy="640" rx="640" ry="230" fill="url(#poolMain)" filter="url(#softC)"/>

  <!-- window: cold rim preserved -->
  <g>
    <rect x="140" y="110" width="250" height="320" fill="#0d1117"/>
    <rect x="155" y="125" width="220" height="290" fill="url(#moonWindowC)"/>
    <rect x="260" y="125" width="10" height="290" fill="#0d1117"/>
    <rect x="155" y="262" width="220" height="10" fill="#0d1117"/>
    <circle cx="205" cy="185" r="26" fill="#93abcc" opacity="0.75"/>
    <!-- faint cool spill kept as depth anchor -->
    <polygon points="150,430 390,430 500,720 80,720" fill="#20304a" opacity="0.14" filter="url(#softC)"/>
    <!-- warm edge on window frame facing lamp -->
    <rect x="386" y="112" width="6" height="320" fill="#8a5c30" opacity="0.55"/>
  </g>

  <!-- door readable, warm-lit from left -->
  <g>
    <rect x="1298" y="188" width="194" height="16" fill="#4a3623"/>
    <rect x="1310" y="204" width="170" height="556" fill="#3a2a1c"/>
    <rect x="1310" y="204" width="14" height="556" fill="#54402a"/>
    <circle cx="1338" cy="492" r="7" fill="#c9973f"/>
    <polygon points="1310,760 1480,760 1520,860 1280,860" fill="#241a10" opacity="0.8"/>
  </g>

  <!-- shelf with books + personal objects -->
  <g>
    <rect x="952" y="342" width="308" height="12" rx="3" fill="#5c4128"/>
    <rect x="952" y="354" width="308" height="6" fill="#241a10" opacity="0.5"/>
    <g>
      <rect x="982" y="258" width="32" height="84" rx="2" fill="#8a5138"/>
      <rect x="1020" y="270" width="26" height="72" rx="2" fill="#5d6152"/>
      <rect x="1052" y="262" width="36" height="80" rx="2" fill="#6e4a52"/>
      <rect x="1094" y="276" width="24" height="66" rx="2" fill="#4f6155"/>
      <rect x="1122" y="264" width="30" height="78" rx="2" fill="#7a5638" transform="skewX(-6)"/>
      <!-- small robot figurine (AI nod) -->
      <rect x="1180" y="292" width="26" height="28" rx="4" fill="#9aa3ad"/>
      <rect x="1186" y="280" width="14" height="12" rx="3" fill="#c2cad2"/>
      <circle cx="1190" cy="286" r="2.4" fill="#2b5a4a"/>
      <circle cx="1196" cy="286" r="2.4" fill="#2b5a4a"/>
      <!-- trailing plant -->
      <path d="M1236 340 q -8 -30 6 -46 q 4 18 10 26 q 6 -20 16 -28" stroke="#4f6b45" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="1248" cy="344" rx="22" ry="8" fill="#7a5638"/>
    </g>
  </g>

  <!-- desk -->
  <g>
    <polygon points="700,556 1160,556 1184,586 676,586" fill="#7a5638"/>
    <polygon points="700,556 1160,556 1160,564 700,564" fill="#96683f"/>
    <rect x="714" y="586" width="22" height="212" fill="#4a3320"/>
    <rect x="1122" y="586" width="22" height="212" fill="#4a3320"/>
    <!-- mug + papers -->
    <rect x="1060" y="530" width="26" height="26" rx="5" fill="#8a5138"/>
    <polygon points="1086,536 1102,542 1086,548" fill="#8a5138"/>
    <polygon points="740,548 800,544 804,556 738,558" fill="#cfc4ae" opacity="0.85"/>
  </g>

  <!-- chair -->
  <g>
    <rect x="565" y="466" width="130" height="20" rx="8" fill="#33261a"/>
    <rect x="563" y="356" width="16" height="126" rx="6" fill="#3d2d1e"/>
    <rect x="681" y="356" width="16" height="126" rx="6" fill="#3d2d1e"/>
    <rect x="583" y="486" width="14" height="196" fill="#241a10"/>
    <rect x="663" y="486" width="14" height="196" fill="#241a10"/>
    <rect x="540" y="682" width="180" height="12" rx="6" fill="#241a10"/>
  </g>

  <!-- monitor: secondary now -->
  <g>
    <rect x="812" y="372" width="196" height="130" rx="6" fill="#14100c"/>
    <rect x="824" y="384" width="172" height="106" fill="url(#monitorGlowC)"/>
    <rect x="886" y="502" width="46" height="28" fill="#14100c"/>
    <rect x="862" y="530" width="94" height="12" rx="5" fill="#14100c"/>
    <g fill="#79d9b8" opacity="0.5">
      <rect x="838" y="396" width="96" height="5"/>
      <rect x="838" y="410" width="132" height="5"/>
      <rect x="838" y="424" width="70" height="5"/>
    </g>
    <rect x="1008" y="376" width="4" height="126" fill="#8a5c30" opacity="0.4"/>
  </g>
  <polygon points="760,544 900,544 910,556 752,558" fill="#241a12"/>
  <g fill="#3a3128">
    <rect x="930" y="540" width="52" height="10" rx="4"/>
  </g>

  <!-- cast shadows away from lamp center -->
  <polygon points="714,798 748,798 850,900 770,900" fill="#120c06" opacity="0.75"/>
  <polygon points="1122,798 1156,798 1290,900 1210,900" fill="#120c06" opacity="0.7"/>
  <ellipse cx="630" cy="700" rx="140" ry="26" fill="#120c06" opacity="0.5"/>

  <!-- lamp fully lit, slight residual sway -->
  <g transform="rotate(-1.2 800 0)">
    <line x1="800" y1="0" x2="800" y2="228" stroke="#2e241a" stroke-width="6"/>
    <!-- shade outer dark metal, inner reflectant -->
    <polygon points="712,310 888,310 844,226 756,226" fill="#211811"/>
    <polygon points="726,300 874,300 838,236 762,236" fill="#5c4128"/>
    <polygon points="712,310 888,310 880,304 720,304" fill="#ffdca4"/>
    <ellipse cx="800" cy="330" rx="360" ry="300" fill="url(#bulbGlowC)"/>
    <circle cx="800" cy="322" r="17" fill="#fff3d8"/>
    <path d="M 800 312 q 5 6 -2 10 q 6 5 -1 10" stroke="#d98a2e" stroke-width="2.5" fill="none"/>
  </g>

  <!-- pull cord resting -->
  <path d="M 838 298 Q 846 380 842 468" stroke="#4a3a26" stroke-width="4" fill="none"/>
  <circle cx="842" cy="472" r="8" fill="#6b543a"/>

  <!-- subtle vignette -->
  <rect width="1600" height="900" fill="#000000" opacity="0.06"/>
</svg>
